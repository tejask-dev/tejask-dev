name: Profile activity

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/update_activity.py'
      - 'scripts/test_activity.py'
      - 'data/activity.json'
      - 'assets/profile/activity-*.svg'
      - '.github/workflows/profile-activity.yml'
  push:
    paths:
      - 'scripts/update_activity.py'
      - 'scripts/test_activity.py'
      - '.github/workflows/profile-activity.yml'

permissions:
  contents: read

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/test_activity.py
      - run: python scripts/update_activity.py --check

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Refresh public snapshot and assets
        run: python scripts/update_activity.py
      - name: Verify refreshed assets
        run: python scripts/update_activity.py --check
      - name: Commit changed profile assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/activity.json assets/profile/activity-dark.svg assets/profile/activity-light.svg assets/profile/activity-dark-mobile.svg assets/profile/activity-light-mobile.svg
          if git diff --cached --quiet; then
            echo "No public activity changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile activity' -- data/activity.json assets/profile/activity-dark.svg assets/profile/activity-light.svg assets/profile/activity-dark-mobile.svg assets/profile/activity-light-mobile.svg
          git push origin "HEAD:${DEFAULT_BRANCH}"
