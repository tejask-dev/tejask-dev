<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Open Water — Tejass Kaushik&#x27;s personal portfolio</title><desc id="desc">Engineering, research, and an ocean to explore. A gently moving yacht and blue waves invite you into the interactive portfolio. Reading pages are also available.</desc>
<style>
@keyframes travel { to { stroke-dashoffset: -100; } }
@keyframes breathe { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
@keyframes voice { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
@keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-24px); } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes draw { 0%,15% { stroke-dashoffset: 100; } 65%,100% { stroke-dashoffset: 0; } }
.signal { stroke-dasharray: 13 87; animation: travel 5s linear infinite; }
.beacon { animation: breathe 5s ease-in-out infinite; }
.wavebar { transform-box: fill-box; transform-origin: center; animation: voice 3.2s ease-in-out infinite; }
.drift { animation: drift 12s ease-in-out infinite; }
.float { animation: float 7s ease-in-out infinite; }
.trace { stroke-dasharray: 100; animation: draw 9s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .signal,.beacon,.wavebar,.drift,.float,.trace { animation: none; }
  .signal { stroke-dasharray: none; opacity: .55; }
  .trace { stroke-dasharray: none; }
}
</style>
<rect width="1200" height="310" rx="18" fill="#08182e"/>
<rect x=".5" y=".5" width="1199" height="309" rx="18" fill="none" stroke="#24466d"/>
<text x="48" y="44" fill="#a1b9db" font-family="'SFMono-Regular',Consolas,monospace" font-size="16" font-weight="400" >EXPLORE / MY PERSONAL PORTFOLIO</text><text x="45" y="125" fill="#edf5ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="70" font-weight="650" letter-spacing="-3">Open Water.</text><text x="48" y="174" fill="#78b7ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="500" >Engineering, research,</text><text x="48" y="210" fill="#a1b9db" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" >and an ocean to explore.</text><g transform="translate(690 46)"><circle cx="382" cy="37" r="25" fill="#102b4d"/><path d="M8 65H480" stroke="#24466d" stroke-dasharray="2 8"/><g class="float"><path d="M98 131H354L328 160H130Z" fill="#78b7ff"/><path d="M154 101H286L313 126H132Z" fill="#edf5ff"/><path d="M177 82H248L270 98H164Z" fill="#acdfff"/><path d="M196 80V58H231" fill="none" stroke="#acdfff" stroke-width="3"/><path d="M177 108H207M216 108H245M254 108H278" stroke="#08182e" stroke-width="6"/></g><path class="drift" d="M0 165Q30 151 60 165T120 165T180 165T240 165T300 165T360 165T420 165T480 165T540 165" fill="none" stroke="#78b7ff" stroke-width="2" style="animation-duration:10s;animation-delay:0s"/><path class="drift" d="M0 189Q30 175 60 189T120 189T180 189T240 189T300 189T360 189T420 189T480 189T540 189" fill="none" stroke="#24466d" stroke-width="1" style="animation-duration:13s;animation-delay:-3s"/><path class="drift" d="M0 213Q30 199 60 213T120 213T180 213T240 213T300 213T360 213T420 213T480 213T540 213" fill="none" stroke="#24466d" stroke-width="1" style="animation-duration:16s;animation-delay:-6s"/></g><text x="48" y="280" fill="#78b7ff" font-family="'SFMono-Regular',Consolas,monospace" font-size="17" font-weight="600" >STEP INSIDE OPEN WATER ↗</text>
</svg>
